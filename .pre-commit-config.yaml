repos:
  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black

  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: py -m pylint
        language: system
        types: [python]
        args: ["--disable=C0114,C0115,C0116,R0903,R0902,W0613 "]
